[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anywhere-claude-mem"
version = "0.4.0"
description = "Cross-machine claude-mem synchronization for OpenCode and DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bleed00" }]
dependencies = [
    "rich>=13",
    "questionary>=2",
]

[project.scripts]
anywhere-claude-mem = "anywhere_claude_mem.cli:main"
anywhere-push = "anywhere_claude_mem.cli:main"
anywhere-pull = "anywhere_claude_mem.cli:main"

[tool.setuptools.packages.find]
include = ["anywhere_claude_mem*"]
