autoInstallPeers: false

minimumReleaseAgeExclude:
  # Fresh @deepseek-ai rc/canary builds land faster than the release-age
  # cutoff; name-only rules avoid the pnpm quirk where only the first
  # version-specific rule per package name is honored.
  - '@deepseek-ai/cordis'
  - '@deepseek-ai/cosmokit'
  - '@deepseek-ai/dsh-agent'
  - '@deepseek-ai/dsh-skill'
  - '@deepseek-ai/schemastery'
