name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin is a dsh bundle: its peerDependencies (cordis, schemastery,
      # dsh-skill) are supplied by the host dsh installation, never installed
      # standalone. Disabling auto-install-peers mirrors the real profile install.
      - run: pnpm install --config.auto-install-peers=false
        working-directory: dsh-plugin
      - run: pnpm run build
        working-directory: dsh-plugin
      - run: pnpm test
        working-directory: dsh-plugin
